name: C++ CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Build examples and run regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          g++ --version
          python3 --version
      - name: Build usage examples
        run: |
          make -C example
          make -C extend
      - name: Run regression checks and README example
        run: bash tests/run.sh
